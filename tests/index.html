<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training plan browser tests</title>
  <style>
    :root { font-family: "Segoe UI", sans-serif; color: #20231f; background: #f2f0e8; }
    body { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0; font-size: 28px; }
    p { color: #60645c; font-size: 14px; line-height: 1.55; }
    button { border: 0; border-radius: 3px; padding: 10px 14px; background: #20231f; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #summary { margin: 18px 0 8px; font-size: 13px; font-weight: 700; }
    #results { display: grid; gap: 6px; padding: 0; list-style: none; }
    #results li { padding: 10px 12px; border-left: 3px solid #c9cbc2; background: #fffefa; font-size: 13px; }
    #results li.pass { border-color: #527468; }
    #results li.fail { border-color: #ec5538; color: #8c2f1e; }
    iframe { position: fixed; width: 1px; height: 1px; left: -10px; top: 0; border: 0; visibility: hidden; }
  </style>
</head>
<body>
  <h1>Training plan browser tests</h1>
  <p>Runs against the actual page in an isolated test-storage namespace. It does not read or clear your guest profile, change the saved theme, or connect to Supabase.</p>
  <button id="run-tests" type="button">RUN TESTS</button>
  <div id="summary" role="status" aria-live="polite">Ready</div>
  <ul id="results" aria-live="polite"></ul>
  <iframe id="app-frame" title="Training plan under test"></iframe>

  <script>
    const testStorageKeys = ["ftp250-test-plan-v1", "ftp250-test-profile-v1", "ftp250-test-history-v1"];
    const frame = document.querySelector("#app-frame");
    const results = document.querySelector("#results");
    const summary = document.querySelector("#summary");
    const runButton = document.querySelector("#run-tests");
    let appDocument;

    function assertEqual(actual, expected, message) {
      if (actual !== expected) throw new Error(`${message}: expected "${expected}", got "${actual}"`);
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function resetTestStorage() {
      testStorageKeys.forEach((key) => localStorage.removeItem(key));
    }

    function loadApp() {
      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error("Timed out loading the app iframe")), 10000);
        frame.addEventListener("load", () => {
          clearTimeout(timeout);
          appDocument = frame.contentDocument;
          if (!appDocument) reject(new Error("The app iframe is not same-origin"));
          else resolve();
        }, { once: true });
        frame.src = `../index.html?testMode=1&testRun=${Date.now()}`;
      });
    }

    function click(selector) {
      const element = appDocument.querySelector(selector);
      assert(element, `Missing app element ${selector}`);
      element.click();
    }

    function setValue(selector, value) {
      const input = appDocument.querySelector(selector);
      assert(input, `Missing app input ${selector}`);
      input.value = value;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function setChecked(value, checked) {
      const input = appDocument.querySelector(`input[name="training-day"][value="${value}"]`);
      assert(input, `Missing training day ${value}`);
      input.checked = checked;
      input.dispatchEvent(new Event("change", { bubbles: true }));
    }

    async function testProfileCalculationsAndPersistence() {
      resetTestStorage();
      await loadApp();
      click("#edit-profile");
      setValue("#profile-current-ftp", "210");
      setValue("#profile-target-ftp", "260");
      setValue("#profile-weight", "70");
      setValue("#profile-age", "38");
      setValue("#profile-max-hr", "188");
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.querySelector("#profile-dialog").open, false, "Valid profile should close the dialog");
      assertEqual(appDocument.querySelector("#ftp-value").textContent, "210", "Current FTP should be dynamic");
      assertEqual(appDocument.querySelector("#target-ftp-value").textContent, "260", "Target FTP should be dynamic");
      assertEqual(appDocument.querySelector("#current-wkg").textContent, "3.00", "Current W/kg should use profile weight");
      assertEqual(appDocument.querySelector("#target-wkg").textContent, "3.71", "Target W/kg should use profile weight");
      assertEqual(appDocument.querySelector("#age-value").textContent, "38", "Age should be dynamic");
      assertEqual(appDocument.querySelector("#max-hr-value").textContent, "188", "Maximum heart rate should be dynamic");
      assertEqual(appDocument.querySelectorAll("#zone-rows tr")[4].lastElementChild.textContent, "200–221 W", "Threshold zone should use current FTP");

      await loadApp();
      assertEqual(appDocument.querySelector("#target-ftp-value").textContent, "260", "Profile should persist after reload");
      assertEqual(appDocument.querySelector("#weight-value").textContent, "70", "Weight should persist after reload");
    }

    async function testFirstVisitDescriptionUsesProfile() {
      resetTestStorage();
      await loadApp();
      assertEqual(appDocument.title, "Zwift FTP training plan", "First-visit title should not assume an FTP target");
      assert(appDocument.querySelector('meta[name="description"]').content.includes("Create a rider profile"), "Meta description should ask users to create a profile");
      assert(appDocument.querySelector("#hero-copy").textContent.includes("Create your rider profile"), "Hero should explain profile setup");
      assert(!appDocument.querySelector("#hero-copy").textContent.includes("82 kg"), "First-visit copy should not show a fixed rider weight");

      click("#edit-profile");
      setValue("#profile-current-ftp", "210");
      setValue("#profile-target-ftp", "260");
      setValue("#profile-weight", "70");
      setValue("#profile-age", "38");
      setValue("#profile-max-hr", "188");
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.title, "FTP 260 | Zwift training plan", "Document title should use the user's FTP goal");
      assert(appDocument.querySelector('meta[name="description"]').content.includes("210 W current FTP, 260 W goal, 70 kg rider"), "Meta description should use the profile values");
    }

    async function testInvalidProfileIsRejected() {
      await loadApp();
      click("#edit-profile");
      setValue("#profile-current-ftp", "70");
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.querySelector("#profile-dialog").open, true, "Out-of-range FTP should keep the dialog open");
      assertEqual(appDocument.querySelector("#ftp-value").textContent, "210", "Invalid FTP should not change the profile");
    }

    async function testWeeklyScheduleAndAvailability() {
      resetTestStorage();
      await loadApp();
      click("#edit-profile");
      setValue("#profile-current-ftp", "210");
      setValue("#profile-target-ftp", "260");
      setValue("#profile-weight", "70");
      setValue("#profile-age", "38");
      setValue("#profile-max-hr", "188");
      setValue("#profile-weekly-hours", "3.5");
      ["Tue", "Wed", "Thu", "Sat", "Sun"].forEach((day) => setChecked(day, false));
      ["Tue", "Wed", "Thu"].forEach((day) => setChecked(day, true));
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.querySelector("#profile-dialog").open, true, "Wednesday plus only two key days should be rejected");
      assert(appDocument.querySelector("#toast").textContent.includes("three or four key-ride days"), "Schedule error should explain the required cycling days");
      ["Tue", "Wed", "Thu", "Sat", "Sun"].forEach((day) => setChecked(day, false));
      ["Tue", "Wed", "Thu", "Sat"].forEach((day) => setChecked(day, true));
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.querySelectorAll("#workout-list .workout").length, 6, "Three key rides plus Wednesday and fixed strength sessions should be scheduled");
      assertEqual([...appDocument.querySelectorAll("#workout-list .day")].map((node) => node.firstChild.textContent).join(","), "Mon,Tue,Wed,Thu,Fri,Sat", "Strength and cycling sessions should use their assigned days");
      const wednesday = [...appDocument.querySelectorAll("#workout-list .workout")].find((card) => card.querySelector(".day").firstChild.textContent === "Wed");
      assert(wednesday.querySelector(".workout-dose .intensity").textContent.includes("Zone 2"), "The Wednesday session should target Zone 2");
      assert(wednesday.querySelector(".power-target").textContent.includes("126–147 W"), "Wednesday watts should be based on current FTP");
      assert([...appDocument.querySelectorAll("#workout-list .day")].some((node) => node.firstChild.textContent === "Mon") && [...appDocument.querySelectorAll("#workout-list .day")].some((node) => node.firstChild.textContent === "Fri"), "Strength sessions should be scheduled on Monday and Friday");
      assert(appDocument.querySelector("#budget-warning").textContent.includes("above your 3.5 h availability"), "Over-budget key sessions should show a warning");

      click("#edit-profile");
      setValue("#profile-weekly-hours", "6");
      ["Tue", "Wed", "Thu", "Sat", "Sun"].forEach((day) => setChecked(day, true));
      click("#profile-form button[type=submit]");
      click("#week-tabs .week-tab:nth-child(1)");
      assertEqual(appDocument.querySelectorAll("#workout-list .workout").length, 7, "A fifth cycling day and sufficient hours should enable optional recovery");
      assertEqual(appDocument.querySelector("#workout-list .workout:last-child .day").firstChild.textContent, "Sun", "Optional recovery should use the fourth selected day");
      click("#week-tabs .week-tab:nth-child(4)");
      assert(appDocument.querySelector("#workout-list .workout:last-child .day").textContent.includes("rest day"), "A deload rest session should be labeled as rest");
      await loadApp();
      click("#edit-profile");
      assertEqual(appDocument.querySelector("#profile-weekly-hours").value, "6", "Weekly availability should persist");
      assertEqual([...appDocument.querySelectorAll('input[name="training-day"]:checked')].map((input) => input.value).join(","), "Tue,Wed,Thu,Sat,Sun", "Training days should persist");
      click("#cancel-profile");
    }

    async function testStrengthExerciseGuides() {
      resetTestStorage();
      await loadApp();
      const mondayCard = appDocument.querySelector('.workout .exercise-open[data-strength-day="Mon"]').closest(".workout");
      const fridayCard = appDocument.querySelector('.workout .exercise-open[data-strength-day="Fri"]').closest(".workout");
      assert(mondayCard.classList.contains("strength-session") && fridayCard.classList.contains("strength-session"), "Strength sessions should use their distinct layout");
      assert(mondayCard.querySelector(".workout-title").textContent.includes("Foundation"), "Monday should have a purpose-based strength name");
      assert(fridayCard.querySelector(".workout-title").textContent.includes("Pre-ride"), "Friday should have a purpose-based strength name");
      click('.exercise-open[data-strength-day="Mon"]');
      assertEqual(appDocument.querySelector("#strength-dialog").open, true, "Monday exercise details should open in a dialog");
      assert(appDocument.querySelector('.workout .day').textContent.includes("strength"), "Strength sessions should not be labeled as key rides");
      assertEqual(appDocument.querySelectorAll("#exercise-detail-grid .exercise-detail").length, 5, "Monday guide should show all five exercises");
      assert(appDocument.querySelector("#exercise-detail-grid").textContent.includes("Romanian deadlift"), "Monday guide should explain cycling hinge strength");
      assert([...appDocument.querySelectorAll("#exercise-detail-grid img")].every((image) => image.alt && image.src.includes("free-exercise-db/main/exercises/")), "Each Monday exercise should have an accessible dataset image");
      click("#close-strength-dialog");
      click('.exercise-open[data-strength-day="Fri"]');
      assertEqual(appDocument.querySelectorAll("#exercise-detail-grid .exercise-detail").length, 4, "Friday guide should show all four low-fatigue exercises");
      assert(appDocument.querySelector("#strength-dialog-subtitle").textContent.includes("finish fresh"), "Friday guidance should protect the Saturday ride");
      assert([...appDocument.querySelectorAll("#exercise-detail-grid img")].every((image) => image.alt && image.src.includes("free-exercise-db/main/exercises/")), "Each Friday exercise should have an accessible dataset image");
      click("#close-strength-dialog");
    }

    async function testFtpHistoryUpdatesTargets() {
      resetTestStorage();
      await loadApp();
      click("#edit-profile");
      setValue("#profile-current-ftp", "210");
      setValue("#profile-target-ftp", "260");
      setValue("#profile-weight", "70");
      setValue("#profile-age", "38");
      setValue("#profile-max-hr", "188");
      click("#profile-form button[type=submit]");
      setValue("#ftp-test-date", "2026-10-01");
      setValue("#ftp-test-result", "225");
      click("#ftp-test-form button[type=submit]");
      assertEqual(appDocument.querySelector("#ftp-value").textContent, "225", "Retest should update current FTP");
      assert(appDocument.querySelector(".power-target").textContent.includes("198–212 W"), "Future session watt guidance should use the new FTP");
      assertEqual(appDocument.querySelectorAll(".ftp-test-row").length, 1, "Retest should appear in history");

      setValue("#ftp-test-date", "2026-10-01");
      setValue("#ftp-test-result", "230");
      click("#ftp-test-form button[type=submit]");
      assertEqual(appDocument.querySelectorAll(".ftp-test-row").length, 1, "A second result on the same date should replace that day's entry");
      assert(appDocument.querySelector(".power-target").textContent.includes("202–216 W"), "Watt guidance should recalculate after the replacement result");

      setValue("#ftp-test-date", "2026-10-04");
      setValue("#ftp-test-result", "235");
      click("#ftp-test-form button[type=submit]");
      await loadApp();
      assertEqual(appDocument.querySelector("#ftp-value").textContent, "235", "Latest FTP result should persist after reload");
      assertEqual(appDocument.querySelectorAll(".ftp-test-row").length, 2, "Dated test history should persist after reload");
    }

    async function testWorkoutProgressPersists() {
      resetTestStorage();
      await loadApp();
      click("#week-tabs .week-tab:nth-child(7)");
      click('#workout-list .complete-button[data-completion-index="0"]');
      assertEqual(appDocument.querySelector("#progress-text").textContent, "1 of 3 key rides complete", "Ride completion should update progress");
      await loadApp();
      click("#week-tabs .week-tab:nth-child(7)");
      assertEqual(appDocument.querySelector("#progress-text").textContent, "1 of 3 key rides complete", "Ride completion should persist after reload");
    }

    async function testRouteLinksAcrossPlan() {
      await loadApp();
      const weekTabs = [...appDocument.querySelectorAll("#week-tabs .week-tab")];
      assertEqual(weekTabs.length, 12, "Plan should contain 12 weeks");
      for (const tab of weekTabs) {
        tab.click();
        for (const workout of appDocument.querySelectorAll(".workout")) {
          const routeLink = workout.querySelector(".route-link");
          const restNote = workout.querySelector(".route-suggestion").textContent;
          const strengthSession = workout.querySelector(".zwift-name")?.textContent.includes("STRENGTH · CYCLING FOCUSED");
          assert(routeLink?.href.startsWith("https://whatsonzwift.com/world/") || restNote.includes("no ride recommended") || strengthSession, "Each cycling ride should link a route; rest and strength sessions should not");
        }
      }
    }

    async function testGuestModeAndRlsSchema() {
      resetTestStorage();
      await loadApp();
      assertEqual(appDocument.querySelector("#auth-controls").hidden, true, "Test mode should not connect to a real account");
      assert(appDocument.querySelector("#account-status").textContent.includes("Supabase project URL"), "Unconfigured cloud sync should be explained");
      const response = await fetch("../supabase-schema.sql");
      assert(response.ok, "Supabase schema should be available");
      const schema = await response.text();
      assert(schema.includes("alter table public.training_profiles enable row level security"), "Profile table should enable RLS");
      assert(schema.includes("alter table public.workout_completions enable row level security"), "Completion table should enable RLS");
      assert(schema.includes("create table if not exists public.ftp_tests"), "FTP test history should have a database table");
      assert(schema.includes("alter table public.ftp_tests enable row level security"), "FTP test history should enable RLS");
      assert(schema.includes("Users read own FTP tests"), "FTP test history should have owner-only policies");
      assert(schema.includes("weekly_hours numeric"), "Weekly availability should be stored in the profile");
      assert(schema.includes("training_days text[]"), "Training days should be stored in the profile");
      assert(schema.includes("cardinality(training_days) between 4 and 5"), "The database should require Wednesday plus key-ride days");
      assert(schema.includes("'Wed' = any(training_days)"), "The database schedule should require Wednesday availability");
      assert(schema.includes("workout_completions_workout_index_check check (workout_index between 0 and 6)"), "The completion table should allow Zone 2 and strength session indices");
      assert(schema.includes("using (user_id = (select auth.uid()))"), "RLS policies should scope records to the signed-in user");
    }

    async function runTests() {
      const savedTheme = localStorage.getItem("ftp250-theme");
      const tests = [
        ["Profile-first descriptions use each rider's values", testFirstVisitDescriptionUsesProfile],
        ["Profile metrics, zones, and reload persistence", testProfileCalculationsAndPersistence],
        ["Reject invalid profile values", testInvalidProfileIsRejected],
        ["Schedule selected days within weekly availability", testWeeklyScheduleAndAvailability],
        ["Show cycling strength exercises with images and cues", testStrengthExerciseGuides],
        ["Log FTP tests and recalculate future watt targets", testFtpHistoryUpdatesTargets],
        ["Persist workout progress by week", testWorkoutProgressPersists],
        ["Link routes across all training weeks", testRouteLinksAcrossPlan],
        ["Keep guest mode isolated and verify RLS schema", testGuestModeAndRlsSchema]
      ];
      let passed = 0;
      results.replaceChildren();
      runButton.disabled = true;
      summary.textContent = `Running ${tests.length} tests…`;
      for (const [name, test] of tests) {
        const item = document.createElement("li");
        try {
          await test();
          item.className = "pass";
          item.textContent = `PASS  ${name}`;
          passed++;
        } catch (error) {
          item.className = "fail";
          item.textContent = `FAIL  ${name}: ${error.message}`;
        }
        results.append(item);
      }
      resetTestStorage();
      if (savedTheme === null) localStorage.removeItem("ftp250-theme");
      else localStorage.setItem("ftp250-theme", savedTheme);
      frame.removeAttribute("src");
      runButton.disabled = false;
      summary.textContent = `${passed}/${tests.length} tests passed`;
    }

    runButton.addEventListener("click", runTests);
  </script>
</body>
</html>
