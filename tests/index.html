<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training plan browser tests</title>
  <style>
    :root { font-family: "Segoe UI", sans-serif; color: #20231f; background: #f2f0e8; }
    body { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0; font-size: 28px; }
    p { color: #60645c; font-size: 14px; line-height: 1.55; }
    button { border: 0; border-radius: 3px; padding: 10px 14px; background: #20231f; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #summary { margin: 18px 0 8px; font-size: 13px; font-weight: 700; }
    #results { display: grid; gap: 6px; padding: 0; list-style: none; }
    #results li { padding: 10px 12px; border-left: 3px solid #c9cbc2; background: #fffefa; font-size: 13px; }
    #results li.pass { border-color: #527468; }
    #results li.fail { border-color: #ec5538; color: #8c2f1e; }
    iframe { position: fixed; width: 1px; height: 1px; left: -10px; top: 0; border: 0; visibility: hidden; }
  </style>
</head>
<body>
  <h1>Training plan browser tests</h1>
  <p>Runs against the actual page in an isolated test-storage namespace. It does not read or clear your guest profile, change the saved theme, or connect to Supabase.</p>
  <button id="run-tests" type="button">RUN TESTS</button>
  <div id="summary" role="status" aria-live="polite">Ready</div>
  <ul id="results" aria-live="polite"></ul>
  <iframe id="app-frame" title="Training plan under test"></iframe>

  <script>
    const testStorageKeys = ["ftp250-test-plan-v1", "ftp250-test-profile-v1"];
    const frame = document.querySelector("#app-frame");
    const results = document.querySelector("#results");
    const summary = document.querySelector("#summary");
    const runButton = document.querySelector("#run-tests");
    let appDocument;

    function assertEqual(actual, expected, message) {
      if (actual !== expected) throw new Error(`${message}: expected "${expected}", got "${actual}"`);
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function resetTestStorage() {
      testStorageKeys.forEach((key) => localStorage.removeItem(key));
    }

    function loadApp() {
      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error("Timed out loading the app iframe")), 10000);
        frame.addEventListener("load", () => {
          clearTimeout(timeout);
          appDocument = frame.contentDocument;
          if (!appDocument) reject(new Error("The app iframe is not same-origin"));
          else resolve();
        }, { once: true });
        frame.src = `../index.html?testMode=1&testRun=${Date.now()}`;
      });
    }

    function click(selector) {
      const element = appDocument.querySelector(selector);
      assert(element, `Missing app element ${selector}`);
      element.click();
    }

    function setValue(selector, value) {
      const input = appDocument.querySelector(selector);
      assert(input, `Missing app input ${selector}`);
      input.value = value;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
    }

    async function testProfileCalculationsAndPersistence() {
      resetTestStorage();
      await loadApp();
      click("#edit-profile");
      setValue("#profile-current-ftp", "210");
      setValue("#profile-target-ftp", "260");
      setValue("#profile-weight", "70");
      setValue("#profile-age", "38");
      setValue("#profile-max-hr", "188");
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.querySelector("#profile-dialog").open, false, "Valid profile should close the dialog");
      assertEqual(appDocument.querySelector("#ftp-value").textContent, "210", "Current FTP should be dynamic");
      assertEqual(appDocument.querySelector("#target-ftp-value").textContent, "260", "Target FTP should be dynamic");
      assertEqual(appDocument.querySelector("#current-wkg").textContent, "3.00", "Current W/kg should use profile weight");
      assertEqual(appDocument.querySelector("#target-wkg").textContent, "3.71", "Target W/kg should use profile weight");
      assertEqual(appDocument.querySelector("#age-value").textContent, "38", "Age should be dynamic");
      assertEqual(appDocument.querySelector("#max-hr-value").textContent, "188", "Maximum heart rate should be dynamic");
      assertEqual(appDocument.querySelectorAll("#zone-rows tr")[4].lastElementChild.textContent, "200–221 W", "Threshold zone should use current FTP");

      await loadApp();
      assertEqual(appDocument.querySelector("#target-ftp-value").textContent, "260", "Profile should persist after reload");
      assertEqual(appDocument.querySelector("#weight-value").textContent, "70", "Weight should persist after reload");
    }

    async function testFirstVisitDescriptionUsesProfile() {
      resetTestStorage();
      await loadApp();
      assertEqual(appDocument.title, "Zwift FTP training plan", "First-visit title should not assume an FTP target");
      assert(appDocument.querySelector('meta[name="description"]').content.includes("Create a rider profile"), "Meta description should ask users to create a profile");
      assert(appDocument.querySelector("#hero-copy").textContent.includes("Create your rider profile"), "Hero should explain profile setup");
      assert(!appDocument.querySelector("#hero-copy").textContent.includes("82 kg"), "First-visit copy should not show a fixed rider weight");

      click("#edit-profile");
      setValue("#profile-current-ftp", "210");
      setValue("#profile-target-ftp", "260");
      setValue("#profile-weight", "70");
      setValue("#profile-age", "38");
      setValue("#profile-max-hr", "188");
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.title, "FTP 260 | Zwift training plan", "Document title should use the user's FTP goal");
      assert(appDocument.querySelector('meta[name="description"]').content.includes("210 W current FTP, 260 W goal, 70 kg rider"), "Meta description should use the profile values");
    }

    async function testInvalidProfileIsRejected() {
      await loadApp();
      click("#edit-profile");
      setValue("#profile-current-ftp", "70");
      click("#profile-form button[type=submit]");
      assertEqual(appDocument.querySelector("#profile-dialog").open, true, "Out-of-range FTP should keep the dialog open");
      assertEqual(appDocument.querySelector("#ftp-value").textContent, "210", "Invalid FTP should not change the profile");
    }

    async function testWorkoutProgressPersists() {
      resetTestStorage();
      await loadApp();
      click("#week-tabs .week-tab:nth-child(7)");
      click("#workout-list .complete-button");
      assertEqual(appDocument.querySelector("#progress-text").textContent, "1 of 3 key rides complete", "Ride completion should update progress");
      await loadApp();
      click("#week-tabs .week-tab:nth-child(7)");
      assertEqual(appDocument.querySelector("#progress-text").textContent, "1 of 3 key rides complete", "Ride completion should persist after reload");
    }

    async function testRouteLinksAcrossPlan() {
      await loadApp();
      const weekTabs = [...appDocument.querySelectorAll("#week-tabs .week-tab")];
      assertEqual(weekTabs.length, 12, "Plan should contain 12 weeks");
      for (const tab of weekTabs) {
        tab.click();
        for (const workout of appDocument.querySelectorAll(".workout")) {
          const routeLink = workout.querySelector(".route-link");
          const restNote = workout.querySelector(".route-suggestion").textContent;
          assert(routeLink?.href.startsWith("https://whatsonzwift.com/world/") || restNote.includes("no ride recommended"), "Each ride should link a route; rest days should recommend no ride");
        }
      }
    }

    async function testGuestModeAndRlsSchema() {
      resetTestStorage();
      await loadApp();
      assertEqual(appDocument.querySelector("#auth-controls").hidden, true, "Test mode should not connect to a real account");
      assert(appDocument.querySelector("#account-status").textContent.includes("Supabase project URL"), "Unconfigured cloud sync should be explained");
      const response = await fetch("../supabase-schema.sql");
      assert(response.ok, "Supabase schema should be available");
      const schema = await response.text();
      assert(schema.includes("alter table public.training_profiles enable row level security"), "Profile table should enable RLS");
      assert(schema.includes("alter table public.workout_completions enable row level security"), "Completion table should enable RLS");
      assert(schema.includes("using (user_id = (select auth.uid()))"), "RLS policies should scope records to the signed-in user");
    }

    async function runTests() {
      const savedTheme = localStorage.getItem("ftp250-theme");
      const tests = [
        ["Profile-first descriptions use each rider's values", testFirstVisitDescriptionUsesProfile],
        ["Profile metrics, zones, and reload persistence", testProfileCalculationsAndPersistence],
        ["Reject invalid profile values", testInvalidProfileIsRejected],
        ["Persist workout progress by week", testWorkoutProgressPersists],
        ["Link routes across all training weeks", testRouteLinksAcrossPlan],
        ["Keep guest mode isolated and verify RLS schema", testGuestModeAndRlsSchema]
      ];
      let passed = 0;
      results.replaceChildren();
      runButton.disabled = true;
      summary.textContent = `Running ${tests.length} tests…`;
      for (const [name, test] of tests) {
        const item = document.createElement("li");
        try {
          await test();
          item.className = "pass";
          item.textContent = `PASS  ${name}`;
          passed++;
        } catch (error) {
          item.className = "fail";
          item.textContent = `FAIL  ${name}: ${error.message}`;
        }
        results.append(item);
      }
      resetTestStorage();
      if (savedTheme === null) localStorage.removeItem("ftp250-theme");
      else localStorage.setItem("ftp250-theme", savedTheme);
      frame.removeAttribute("src");
      runButton.disabled = false;
      summary.textContent = `${passed}/${tests.length} tests passed`;
    }

    runButton.addEventListener("click", runTests);
  </script>
</body>
</html>
